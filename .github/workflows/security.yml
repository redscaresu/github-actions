name: Security

# Reusable security gates. A caller job must grant the union of the job
# permissions below; each job narrows back to what it needs.
on:
  workflow_call:
    inputs:
      zizmor:
        description: Run the zizmor audit of GitHub Actions workflows.
        type: boolean
        default: true
      gitleaks:
        description: Run the gitleaks secret scan over the full history of the checked-out commit.
        type: boolean
        default: true

permissions: {}

jobs:
  zizmor:
    if: inputs.zizmor && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of a private repo needs it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Dependabot does not bump `version:`; bump it by hand.
          version: 1.30.1
          # Fail the job on findings and upload no SARIF (needs code scanning).
          advanced-security: false

  gitleaks:
    if: inputs.gitleaks && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of a private repo needs it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Run gitleaks
        # The binary, not gitleaks-action: the action needs more than
        # contents: read for PR comments. Dependabot bumps neither the version
        # nor the sha256; bump both by hand from the release's checksums.txt.
        # A repo-root .gitleaks.toml is loaded without --config.
        run: |
          tarball="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          # -v prints each (redacted) finding; without it only the count is logged.
          # HEAD: the default --all also scans every fetched branch, so a secret
          # on one unmerged branch would fail every other run. "--": a file
          # named HEAD makes git log fail, which gitleaks reports as no leaks.
          "$RUNNER_TEMP"/gitleaks detect --redact -v --no-banner --log-opts="HEAD --" --source=.
