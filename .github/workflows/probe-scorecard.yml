name: Probe Scorecard

# Calls the reusable scorecard.yml on push to main to see whether Scorecard
# publishes from a workflow_call job. Removed once the result is read.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/scorecard.yml
